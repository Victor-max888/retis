name: Build Retis for Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 编译 Retis 纯静态二进制 (Android 专用)
        run: |
          cat << 'EOF' > run_build.sh
          #!/bin/sh
          set -eux

          apk update
          # 安装完整编译链及静态库（补齐 zstd-static 保证 libelf 静态解析）
          apk add git rust cargo clang llvm llvm-dev clang-dev elfutils-dev \
                  musl-dev linux-headers make pkgconfig zlib-dev zlib-static \
                  zstd-static libpcap-dev jq coreutils binutils

          LLVM_BIN=$(find /usr/lib/llvm*/bin -name llvm-objcopy 2>/dev/null | head -n 1)
          if [ -n "$LLVM_BIN" ]; then
              export PATH="$(dirname $LLVM_BIN):$PATH"
          fi

          git clone --depth 1 https://github.com/retis-org/retis.git /retis
          cd /retis

          TARGET=$(rustc -vV | sed -n 's|host: ||p')

          # 【核心修复】：在 [build] 中显式绑定目标，激活 Target 静态参数
          mkdir -p .cargo
          cat << CARGO_EOF > .cargo/config.toml
          [build]
          target = "${TARGET}"

          [target.${TARGET}]
          rustflags = [
              "-C", "target-feature=+crt-static",
              "-C", "link-arg=-static"
          ]
          CARGO_EOF

          # 执行编译（跳过 Python 插件）
          CARGO_CMD_OPTS="--no-default-features" make release

          # 定位目标产物并去除调试符号
          BIN_PATH=$(find target/${TARGET}/release target/release -name retis -type f -perm -111 2>/dev/null | head -n 1)
          strip "$BIN_PATH"
          cp "$BIN_PATH" /output/retis
          EOF

          chmod +x run_build.sh
          docker run --rm -v ${{ github.workspace }}:/output alpine:edge /output/run_build.sh

      - name: 验证二进制属性 (必须为 statically linked)
        run: |
          ls -lh retis
          file retis
          # 门禁断言：无动态解释器
          file retis | grep -q "statically linked"

      - name: 上传构建产物 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: retis-android-arm64
          path: retis
