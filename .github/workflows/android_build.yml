name: Build Retis for Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 编译并处理单二进制
        run: |
          mkdir -p output

          cat << 'BUILD_SCRIPT' > run_build.sh
          #!/bin/sh
          set -eux

          apk update
          apk add bash git rust cargo clang llvm llvm-dev clang-dev \
                  elfutils-dev libelf-static musl-dev linux-headers make \
                  pkgconfig zlib-dev zlib-static zstd-static bzip2-static \
                  libpcap-dev jq coreutils binutils libnl3-dev libnl3-static python3

          # 寻找 llvm-objcopy 并注入 PATH
          LLVM_BIN=$(find /usr/lib/llvm*/bin -name llvm-objcopy 2>/dev/null | head -n 1)
          if [ -n "$LLVM_BIN" ]; then
              export PATH="$(dirname $LLVM_BIN):$PATH"
          fi

          cd /workspace

          # 强制 C 库静态内联
          export PKG_CONFIG_ALL_STATIC=1
          export LIBPCAP_STATIC=true

          # 绝不注入全局 RUSTFLAGS，避免破坏 btf-rs-derive 过程宏
          rm -rf .cargo/config.toml
          unset RUSTFLAGS

          # 编译 Retis
          CARGO_CMD_OPTS="--no-default-features" make release

          # 提取二进制到独立目录
          TARGET_BIN=$(find target -name retis -type f -perm -111 | grep -v '\.d$' | head -n 1)
          cp "$TARGET_BIN" /output/retis
          strip /output/retis

          # 【终极手术】：将 ELF 头的 PT_INTERP(3) 抹除为 PT_NULL(0)
          # 拔除对 /lib/ld-musl-aarch64.so.1 的硬编码寻找
          python3 -c '
          import struct
          with open("/output/retis", "r+b") as f:
              data = f.read()
              e_phoff = struct.unpack_from("<Q", data, 32)[0]
              e_phentsize = struct.unpack_from("<H", data, 54)[0]
              e_phnum = struct.unpack_from("<H", data, 56)[0]
              found = False
              for i in range(e_phnum):
                  offset = e_phoff + i * e_phentsize
                  p_type = struct.unpack_from("<I", data, offset)[0]
                  if p_type == 3:  # PT_INTERP
                      f.seek(offset)
                      f.write(struct.pack("<I", 0))  # 覆写为 PT_NULL
                      found = True
                      print(">>> [SUCCESS] 成功抹除 PT_INTERP 解释器路径！<<<")
                      break
              if not found:
                  print(">>> [INFO] 未检测到 PT_INTERP 或已抹除。<<<")
          '
          BUILD_SCRIPT

          chmod +x run_build.sh

          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/output:/output \
            alpine:edge /workspace/run_build.sh

      - name: 门禁验证与属性核查
        run: |
          ls -lh output/retis
          file output/retis

          # 1. 验证 file 输出中绝对不再包含 interpreter 解释器路径
          if file output/retis | grep -qi "interpreter"; then
              echo "错误: file 检查显示依然残留动态解释器！"
              exit 1
          fi

          # 2. 精准验证 Program Headers 表（只匹配大写的 INTERP 类型段，绝不误杀小写的 .interp 节名）
          if readelf -l output/retis | awk '$1 == "INTERP"' | grep -q "INTERP"; then
              echo "错误: Program Headers 中依然存在 PT_INTERP 解释器段！"
              exit 1
          fi

          echo "=========================================="
          echo "门禁检查 100% 通过！二进制无动态解释器请求！"
          echo "=========================================="

      - name: 上传 Retis 单二进制
        uses: actions/upload-artifact@v4
        with:
          name: retis-android-arm64
          path: output/retis
