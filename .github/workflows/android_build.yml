name: Build Retis for Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 编译真正的纯静态 Android 单二进制
        run: |
          mkdir -p output

          cat << 'BUILD_SCRIPT' > run_build.sh
          #!/bin/sh
          set -eux

          apk update
          # 安装全部 C 依赖的静态库与工具链
          apk add bash git rust cargo clang llvm llvm-dev clang-dev \
                  elfutils-dev libelf-static musl-dev linux-headers make \
                  pkgconfig zlib-dev zlib-static zstd-static bzip2-static \
                  libpcap-dev jq coreutils binutils libnl3-dev libnl3-static

          # 注入 llvm-objcopy
          LLVM_BIN=$(find /usr/lib/llvm*/bin -name llvm-objcopy 2>/dev/null | head -n 1)
          if [ -n "$LLVM_BIN" ]; then
              export PATH="$(dirname $LLVM_BIN):$PATH"
          fi

          cd /workspace

          # 强制 C 库走纯静态检索
          export PKG_CONFIG_ALL_STATIC=1
          export LIBPCAP_STATIC=true

          # 1. 彻底清除任何可能污染过程宏的全局 RUSTFLAGS
          unset RUSTFLAGS
          rm -rf .cargo/config.toml

          # 2. 核心隔离机制：只对目标 target 启用纯静态，绝不波及 host 上的 proc-macro
          mkdir -p .cargo
          cat << 'EOF' > .cargo/config.toml
          [target.aarch64-alpine-linux-musl]
          rustflags = [
              "-C", "target-feature=+crt-static",
              "-C", "link-arg=-static",
              "-C", "link-arg=-no-pie"
          ]
          EOF

          # 开启 Cargo 宿主隔离特性，确保主机构建工具完全忽略 target flags
          export CARGO_TARGET_APPLIES_TO_HOST=false

          # 3. 显式传递 --target 参数，让 Cargo 触发隔离机制
          CARGO_CMD_OPTS="--no-default-features --target aarch64-alpine-linux-musl" make release

          # 4. 提取生成的纯静态产物
          TARGET_BIN=$(find target/aarch64-alpine-linux-musl/release target/release -name retis -type f -perm -111 | grep -v '\.d$' | head -n 1)
          cp "$TARGET_BIN" /output/retis
          strip /output/retis
          BUILD_SCRIPT

          chmod +x run_build.sh

          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/output:/output \
            alpine:edge /workspace/run_build.sh

      - name: 门禁断言 (严格验证真·静态)
        run: |
          ls -lh output/retis
          file output/retis

          # 门禁 1：必须是编译器原生的 statically linked
          file output/retis | grep "statically linked"

          # 门禁 2：readelf 绝不含有任何动态依赖库 (DT_NEEDED)
          if readelf -d output/retis 2>/dev/null | grep -i "NEEDED"; then
              echo "错误: 二进制依然含有外部动态库依赖！"
              exit 1
          fi

          echo "=================================================="
          echo "恭喜！编译出了真正的纯静态单二进制！绝无 Segfault 风险！"
          echo "=================================================="

      - name: 上传 Retis 单二进制
        uses: actions/upload-artifact@v4
        with:
          name: retis-android-arm64
          path: output/retis
