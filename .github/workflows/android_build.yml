name: Build Retis for Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 编译真正的纯静态 Android 单二进制
        run: |
          mkdir -p output

          cat << 'BUILD_SCRIPT' > run_build.sh
          #!/bin/sh
          set -eux

          apk update
          # 安装全部开发库及静态库（补齐 xz-dev 确保 liblzma.a 齐全）
          apk add bash git rust cargo clang llvm llvm-dev clang-dev \
                  elfutils-dev libelf-static musl-dev linux-headers make \
                  pkgconfig zlib-dev zlib-static zstd-static bzip2-static \
                  xz-dev libpcap-dev jq coreutils binutils libnl3-dev libnl3-static python3

          # 1. 注入 llvm-objcopy
          LLVM_BIN=$(find /usr/lib/llvm*/bin -name llvm-objcopy 2>/dev/null | head -n 1)
          if [ -n "$LLVM_BIN" ]; then
              export PATH="$(dirname $LLVM_BIN):$PATH"
          fi

          # 2. 修复 musl 静态链接时缺失 -lgcc_s 的问题
          GCC_LIB_DIR=$(gcc -print-file-name=libgcc.a | xargs dirname)
          echo "INPUT(-lgcc -lgcc_eh)" > "$GCC_LIB_DIR/libgcc_s.a"

          # 3. 拦截器：放行过程宏与构建工具，捕获 retis 并补全 libelf 间接静态库
          REAL_GCC=$(which gcc)
          mkdir -p /usr/local/bin

          cat << EOF > /usr/local/bin/gcc-wrapper
          #!/bin/sh
          OUTPUT_TARGET=""
          PREV_ARG=""
          IS_SHARED=0

          for arg in "\$@"; do
              if [ "\$PREV_ARG" = "-o" ]; then
                  OUTPUT_TARGET="\$arg"
              fi
              if [ "\$arg" = "-shared" ]; then
                  IS_SHARED=1
              fi
              PREV_ARG="\$arg"
          done

          # A. proc-macro 动态库 (-shared 或 .so) -> 100% 原生放行
          if [ \$IS_SHARED -eq 1 ]; then
              exec $REAL_GCC "\$@"
          fi
          case "\$OUTPUT_TARGET" in
              *.so|*.so.*)
                  exec $REAL_GCC "\$@"
                  ;;
          esac

          # B. 主机构建脚本 (build_script_build) -> 100% 原生放行
          case "\$OUTPUT_TARGET" in
              *build_script_build*)
                  exec $REAL_GCC "\$@"
                  ;;
          esac

          # C. 命中 retis 二进制 -> 注入 -static 并补全静态传递依赖 (-lzstd -lbz2 -llzma)
          case "\$OUTPUT_TARGET" in
              *retis*)
                  echo ">>> [LINKER WRAPPER HIT] 拦截到 retis 二进制: \$OUTPUT_TARGET，补全静态依赖并执行全静态链接... <<<"
                  NEW_ARGS=""
                  for arg in "\$@"; do
                      case "\$arg" in
                          -Wl,-Bdynamic)
                              NEW_ARGS="\$NEW_ARGS -Wl,-Bstatic"
                              ;;
                          -pie|-Wl,-pie)
                              # 剥离 PIE 动态特征
                              ;;
                          *)
                              NEW_ARGS="\$NEW_ARGS \$arg"
                              ;;
                      esac
                  done
                  # 核心补全：在末尾追加静态库闭包循环解析，彻底解决 ZSTD_... 符号缺失
                  exec $REAL_GCC -static -no-pie \$NEW_ARGS -Wl,--start-group -lelf -lzstd -lbz2 -lz -llzma -Wl,--end-group
                  ;;
          esac

          exec $REAL_GCC "\$@"
          EOF

          chmod +x /usr/local/bin/gcc-wrapper
          ln -sf /usr/local/bin/gcc-wrapper /usr/local/bin/gcc
          ln -sf /usr/local/bin/gcc-wrapper /usr/local/bin/cc
          ln -sf /usr/local/bin/gcc-wrapper /usr/local/bin/aarch64-alpine-linux-musl-gcc
          export PATH="/usr/local/bin:$PATH"

          cd /workspace

          # 强制 Cargo 指定此包装器作为 target 链接器
          mkdir -p .cargo
          cat << 'EOF_CARGO' > .cargo/config.toml
          [target.aarch64-alpine-linux-musl]
          linker = "/usr/local/bin/gcc-wrapper"
          EOF_CARGO

          export PKG_CONFIG_ALL_STATIC=1
          export LIBPCAP_STATIC=true

          # 4. 执行 Retis 构建
          CARGO_CMD_OPTS="--no-default-features" make release

          # 5. 提取纯静态产物
          TARGET_BIN=$(find target -name retis -type f -perm -111 | grep -v '\.d$' | head -n 1)
          cp "$TARGET_BIN" /output/retis
          strip /output/retis
          BUILD_SCRIPT

          chmod +x run_build.sh

          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/output:/output \
            alpine:edge /workspace/run_build.sh

      - name: 门禁断言 (严格断言纯静态)
        run: |
          ls -lh output/retis
          file output/retis

          # 1. 验证必须是原生的 statically linked
          file output/retis | grep "statically linked"

          # 2. 验证绝无动态解释器
          if file output/retis | grep -i "interpreter"; then
              echo "错误: 依然残留动态解释器！"
              exit 1
          fi

          # 3. 验证绝无外部动态库依赖 (DT_NEEDED)
          if readelf -d output/retis 2>/dev/null | grep -i "NEEDED"; then
              echo "错误: 二进制依然含有外部动态库依赖！"
              exit 1
          fi

          echo "=========================================================="
          echo "纯静态单二进制构建大功告成！推送到 Android 即可直接运行！"
          echo "=========================================================="

      - name: 上传 Retis 单二进制
        uses: actions/upload-artifact@v4
        with:
          name: retis-android-arm64
          path: output/retis
