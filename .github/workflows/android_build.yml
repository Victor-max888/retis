name: Build Retis for Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 编译 Retis 真正的单二进制 (Pure Static)
        run: |
          cat << 'EOF' > run_build.sh
          #!/bin/sh
          set -eux

          apk update
          # 安装编译链及所有静态依赖库（包含 libnl、zstd、bzip2 的静态版本）
          apk add git rust cargo clang llvm llvm-dev clang-dev elfutils-dev \
                  musl-dev linux-headers make pkgconfig zlib-dev zlib-static \
                  zstd-static bzip2-static libpcap-dev jq coreutils binutils \
                  libnl3-dev libnl3-static

          # 修正 LLVM 工具链路径
          LLVM_BIN=$(find /usr/lib/llvm*/bin -name llvm-objcopy 2>/dev/null | head -n 1)
          if [ -n "$LLVM_BIN" ]; then
              export PATH="$(dirname $LLVM_BIN):$PATH"
          fi

          git clone --depth 1 https://github.com/retis-org/retis.git /retis
          cd /retis

          TARGET=$(rustc -vV | sed -n 's|host: ||p')

          # 【核心 1】：强制所有 C 依赖库（libpcap/libelf）在 pkg-config 阶段就必须使用静态归档
          export PKG_CONFIG_ALL_STATIC=1
          export LIBPCAP_STATIC=true

          # 【核心 2】：注入 Rust 原生关闭 PIE 的 relocation-model 以及静态链接参数
          mkdir -p .cargo
          cat << CARGO_EOF > .cargo/config.toml
          [build]
          target = "${TARGET}"

          [target.${TARGET}]
          rustflags = [
              "-C", "target-feature=+crt-static",
              "-C", "relocation-model=static",
              "-C", "link-arg=-static",
              "-C", "link-arg=-no-pie"
          ]
          CARGO_EOF

          # 编译 release 产物
          CARGO_CMD_OPTS="--no-default-features" make release

          # 提取单一二进制并剥离调试符号
          BIN_PATH=$(find target/${TARGET}/release target/release -name retis -type f -perm -111 2>/dev/null | head -n 1)
          strip "$BIN_PATH"
          cp "$BIN_PATH" /output/retis
          EOF

          chmod +x run_build.sh
          docker run --rm -v ${{ github.workspace }}:/output alpine:edge /output/run_build.sh

      - name: 验证二进制属性 (必须为纯静态)
        run: |
          ls -lh retis
          file retis
          # 门禁断言：必须是真正的静态可执行文件，绝不允许出现 interpreter
          file retis | grep -q "statically linked"

      - name: 上传单一二进制文件 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: retis
          path: retis
