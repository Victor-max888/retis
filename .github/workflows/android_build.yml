name: Build Retis for Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 纯静态编译 Retis (无解释器依赖)
        run: |
          cat << 'EOF' > run_build.sh
          #!/bin/sh
          set -eux

          apk update
          apk add git rust cargo clang llvm llvm-dev clang-dev elfutils-dev \
                  musl-dev linux-headers make pkgconfig zlib-dev zlib-static \
                  libpcap-dev jq coreutils binutils

          LLVM_BIN=$(find /usr/lib/llvm*/bin -name llvm-objcopy 2>/dev/null | head -n 1)
          if [ -n "$LLVM_BIN" ]; then
              export PATH="$(dirname $LLVM_BIN):$PATH"
          fi

          git clone --depth 1 https://github.com/retis-org/retis.git /retis
          cd /retis

          # 创建专用的纯静态库隔离目录，不破坏容器自身的系统动态库
          mkdir -p /static-libs
          cp /usr/lib/libpcap.a /static-libs/
          cp /usr/lib/libelf.a /static-libs/
          cp /usr/lib/libz.a /static-libs/

          # 配置 Cargo 专项目标链接参数：
          # 1. target-feature=+crt-static：静态 libc
          # 2. link-arg=-static：强制静态链接
          # 3. 优先检索 /static-libs
          mkdir -p .cargo
          cat << 'CARGO_EOF' > .cargo/config.toml
          [target.aarch64-alpine-linux-musl]
          rustflags = [
              "-C", "target-feature=+crt-static",
              "-C", "link-arg=-static",
              "-L", "native=/static-libs"
          ]
          CARGO_EOF

          # 执行编译
          CARGO_CMD_OPTS="--no-default-features" make release

          # 提取并剥离调试信息
          BIN_PATH=$(find target/release -name retis -type f -perm -111 | head -n 1)
          strip "$BIN_PATH"
          cp "$BIN_PATH" /output/retis
          EOF

          chmod +x run_build.sh
          docker run --rm -v ${{ github.workspace }}:/output alpine:edge /output/run_build.sh

      - name: 验证二进制属性 (严格校验静态属性)
        run: |
          ls -lh retis
          file retis
          # 确保必须是 statically linked，杜绝动态解释器
          file retis | grep -q "statically linked"

      - name: 上传构建产物 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: retis-android-arm64
          path: retis
