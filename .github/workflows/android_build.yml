name: Build Retis for Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 编译真正的纯静态 Android 单二进制
        run: |
          mkdir -p output

          cat << 'BUILD_SCRIPT' > run_build.sh
          #!/bin/sh
          set -eux

          apk update
          apk add bash git rust cargo clang llvm llvm-dev clang-dev \
                  elfutils-dev libelf-static musl-dev linux-headers make \
                  pkgconfig zlib-dev zlib-static zstd-static bzip2-static \
                  libpcap-dev jq coreutils binutils libnl3-dev libnl3-static python3

          # 1. 注入 llvm-objcopy
          LLVM_BIN=$(find /usr/lib/llvm*/bin -name llvm-objcopy 2>/dev/null | head -n 1)
          if [ -n "$LLVM_BIN" ]; then
              export PATH="$(dirname $LLVM_BIN):$PATH"
          fi

          # 2. 【核心武器】：创建智能链接器 Wrapper
          # 精准拦截：对 proc-macro(含-shared) 正常放行；对二进制强制纯静态链接
          REAL_GCC=$(which gcc)
          mkdir -p /usr/local/bin

          cat << EOF > /usr/local/bin/gcc-wrapper
          #!/bin/sh
          # 检查是否是在编译 proc-macro 动态库
          for arg in "\$@"; do
              if [ "\$arg" = "-shared" ]; then
                  exec $REAL_GCC "\$@"
              fi
          done

          # 如果是链接最终的二进制，强制静态链接并把所有动态库转为静态
          NEW_ARGS=""
          for arg in "\$@"; do
              case "\$arg" in
                  -Wl,-Bdynamic)
                      NEW_ARGS="\$NEW_ARGS -Wl,-Bstatic"
                      ;;
                  *)
                      NEW_ARGS="\$NEW_ARGS \$arg"
                      ;;
              esac
          done

          exec $REAL_GCC -static \$NEW_ARGS
          EOF

          chmod +x /usr/local/bin/gcc-wrapper
          # 接管系统所有的 C 链接器入口
          ln -sf /usr/local/bin/gcc-wrapper /usr/local/bin/gcc
          ln -sf /usr/local/bin/gcc-wrapper /usr/local/bin/cc
          ln -sf /usr/local/bin/gcc-wrapper /usr/local/bin/aarch64-alpine-linux-musl-gcc
          export PATH="/usr/local/bin:$PATH"

          cd /workspace

          # 清除所有可能产生干扰的配置
          rm -rf .cargo/config.toml
          unset RUSTFLAGS

          # 静态库检索环境变量
          export PKG_CONFIG_ALL_STATIC=1
          export LIBPCAP_STATIC=true

          # 3. 开始编译
          CARGO_CMD_OPTS="--no-default-features" make release

          # 4. 提取生成的纯静态产物
          TARGET_BIN=$(find target -name retis -type f -perm -111 | grep -v '\.d$' | head -n 1)
          cp "$TARGET_BIN" /output/retis
          strip /output/retis
          BUILD_SCRIPT

          chmod +x run_build.sh

          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/output:/output \
            alpine:edge /workspace/run_build.sh

      - name: 门禁断言 (严格验证原生静态)
        run: |
          ls -lh output/retis
          file output/retis

          # 1. 验证必须是原生的 statically linked
          file output/retis | grep "statically linked"

          # 2. 验证绝无动态解释器
          if file output/retis | grep -i "interpreter"; then
              echo "错误: 依然残留动态解释器！"
              exit 1
          fi

          # 3. 验证绝无外部动态库依赖 (DT_NEEDED)
          if readelf -d output/retis 2>/dev/null | grep -i "NEEDED"; then
              echo "错误: 二进制依然含有外部动态库依赖！"
              exit 1
          fi

          echo "=========================================================="
          echo "恭喜！编译出了真正的纯静态单二进制！绝无 Segfault 风险！"
          echo "=========================================================="

      - name: 上传 Retis 单二进制
        uses: actions/upload-artifact@v4
        with:
          name: retis-android-arm64
          path: output/retis
