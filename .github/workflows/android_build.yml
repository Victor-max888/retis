name: Build Retis for Android ARM64

on:
  workflow_dispatch: # 支持手动点击按钮触发构建

jobs:
  build:
    # 锁定稳定的 Ubuntu 24.04 运行器，消除系统迁移提示
    runs-on: ubuntu-24.04

    steps:
      - name: 启用 ARM64 跨架构支持 (直调容器，消除 Node.js 插件警告)
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: 纯静态编译 Retis (Alpine ARM64)
        run: |
          # 1. 编写容器内部执行脚本（避免复杂的引号转义）
          cat << 'EOF' > run_build.sh
          #!/bin/sh
          set -eux

          apk update
          # 安装编译工具链（已移除不存在的 libpcap-static，保留 libpcap-dev 即可）
          apk add git rust cargo clang llvm-dev clang-dev elfutils-dev \
                  musl-dev linux-headers make pkgconfig zlib-dev zlib-static \
                  libpcap-dev jq coreutils

          # 拉取 retis 源码
          git clone --depth 1 https://github.com/retis-org/retis.git /retis
          cd /retis

          # 注入纯静态链接参数，并关闭 Android 不支持的 python 插件
          export RUSTFLAGS="-C target-feature=+crt-static"
          export CARGO_CMD_OPTS="--no-default-features"

          # 优先调用官方针对无依赖编译的 release 目标
          make release || cargo build --release --no-default-features

          # 自动定位编译生成的 retis 二进制文件并剥离调试符号
          BIN_PATH=$(find target -name retis -type f -perm -111 | head -n 1)
          strip "$BIN_PATH"
          cp "$BIN_PATH" /output/retis
          EOF

          chmod +x run_build.sh

          # 2. 挂载并在 Alpine ARM64 容器内执行编译
          docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/output alpine:edge /output/run_build.sh

      - name: 验证二进制属性
        run: |
          ls -lh retis
          file retis

      - name: 上传构建产物 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: retis-android-arm64
          path: retis
